# One-click deploy di Render.com: New > Blueprint > pilih repo ini.
services:
  - type: web
    name: petmorph-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: mock
      - key: TTS_PROVIDER
        value: mock
      - key: IMAGE_PROVIDER
        value: local
      - key: STORAGE_PROVIDER
        value: local
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: petmorph-db
          property: connectionString
databases:
  - name: petmorph-db
    databaseName: petmorph
    plan: free
